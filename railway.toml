[build]
builder = "nixpacks"
buildCommand = "npm install && cd server && npm install && cd ../client && npm install && cd .. && npx prisma generate && cd server && npm run build && cd ../client && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && node server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production]
buildCommand = "npm install && cd server && npm install && cd ../client && npm install && cd .. && npx prisma generate && cd server && npm run build && cd ../client && npm run build"
startCommand = "npx prisma migrate deploy && node server/dist/index.js"
