<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="bg-at" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="aura-at" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-at">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gold-at">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="blade-at" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Background (iOS clips to circle, but fill full square) -->
  <rect width="180" height="180" fill="url(#bg-at)"/>
  <ellipse cx="90" cy="90" rx="78" ry="78" fill="url(#aura-at)"/>

  <!-- Shield -->
  <path d="M 90 24 L 138 46 L 138 90 C 138 118 116 140 90 150 C 64 140 42 118 42 90 L 42 46 Z"
    fill="#0d0520" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M 90 34 L 128 52 L 128 90 C 128 114 108 132 90 140 C 72 132 52 114 52 90 L 52 52 Z"
    fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.55"/>

  <!-- Sword -->
  <rect x="86.5" y="38" width="7" height="78" rx="2.5" fill="url(#blade-at)" filter="url(#glow-at)"/>

  <!-- Crossguard -->
  <rect x="66" y="96" width="48" height="8" rx="4" fill="#f59e0b" filter="url(#gold-at)"/>

  <!-- Pommel -->
  <ellipse cx="90" cy="122" rx="9" ry="7" fill="#f59e0b" filter="url(#gold-at)"/>

  <!-- Blade tip glow -->
  <ellipse cx="90" cy="41" rx="5" ry="5" fill="#a78bfa" opacity="0.8" filter="url(#glow-at)"/>
</svg>
